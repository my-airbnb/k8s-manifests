---
# ClientSettingsPolicy — body size limits per route group
# Replaces: nginx.ingress.kubernetes.io/proxy-body-size
# Standard routes: 20m
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: default-body-size
  namespace: airbnb
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: airbnb-route
  body:
    maxSize: 20m

---
# Upload route gets its own larger limit: 200m
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: upload-body-size
  namespace: airbnb
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: data-seeder-upload-route
  body:
    maxSize: 200m