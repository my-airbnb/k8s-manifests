---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: airbnb-route
  namespace: airbnb
spec:
  parentRefs:
    - name: main-gateway
      namespace: airbnb
      sectionName: https-airbb
  hostnames:
    - "airbb.serghini.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/auth
      backendRefs:
        - name: service-auth
          port: 8081

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/listings
      backendRefs:
        - name: service-listing
          port: 8082

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/experiences
      backendRefs:
        - name: service-listing
          port: 8082

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/bookings
      backendRefs:
        - name: service-booking
          port: 8083

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/payments
      backendRefs:
        - name: service-payment
          port: 8084

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/conversations
      backendRefs:
        - name: service-chat
          port: 8085

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/reviews
      backendRefs:
        - name: service-review
          port: 8086

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/suggestions
      backendRefs:
        - name: service-suggestion
          port: 8087

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/notifications
      backendRefs:
        - name: service-notification
          port: 8088

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/wishlists
      backendRefs:
        - name: service-wishlist
          port: 8089

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/availability
      backendRefs:
        - name: service-availability
          port: 8090

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/recently-viewed
      backendRefs:
        - name: service-recently-viewed
          port: 8091

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/guidebook
      backendRefs:
        - name: service-guidebook
          port: 8092

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/coupons
      backendRefs:
        - name: service-coupon
          port: 8093

    - matches:
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - name: service-chat
          port: 8085

    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/seed
      backendRefs:
        - name: data-seeder
          port: 8086

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 3000