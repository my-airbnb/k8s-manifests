apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-ingress
  namespace: airbnb
  annotations:
    kubernetes.io/ingress.class: nginx
    # Strip /storage prefix so MinIO sees /bucket/key directly
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - airbb.serghini.me
      secretName: airbb-serghini-me-tls
  rules:
    - host: airbb.serghini.me
      http:
        paths:
          - path: /storage(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: minio
                port:
                  number: 9000
