apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-coupon
  namespace: airbnb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-coupon
  template:
    metadata:
      labels:
        app: service-coupon
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: service-coupon
          image: ghcr.io/my-airbnb/service-coupon:dev-3279088deac5406c406aeabbb49859d9b21aca19
          ports:
            - containerPort: 8093
          envFrom:
            - configMapRef:
                name: service-coupon-config
            # JWT signing key is shared cluster-wide; reuse the auth service's
            # secret (its issuer) so all services validate tokens with one key.
            - secretRef:
                name: service-auth-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "400m"
          livenessProbe:
            tcpSocket:
              port: 8093
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8093
            initialDelaySeconds: 25
            periodSeconds: 5
