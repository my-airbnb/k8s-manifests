apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-payment
  namespace: airbnb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-payment
  template:
    metadata:
      labels:
        app: service-payment
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: service-payment
          image: ghcr.io/my-airbnb/service-payment:dev-9a65f73f53cd38afc47f20d45e42aaf985bab57c
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: service-payment-config
            - secretRef:
                name: service-payment-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
