apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-review
  namespace: airbnb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-review
  template:
    metadata:
      labels:
        app: service-review
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: service-review
          image: ghcr.io/my-airbnb/service-review:dev-b71bb1353b0fb6378f5a6d0ca3d40b9cca4dfdd0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: service-review-config
            - secretRef:
                name: service-review-secret
            - secretRef:
                name: rabbitmq-app-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
