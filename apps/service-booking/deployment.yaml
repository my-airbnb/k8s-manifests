apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-booking
  namespace: airbnb
spec:
  replicas: 0
  selector:
    matchLabels:
      app: service-booking
  template:
    metadata:
      labels:
        app: service-booking
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: service-booking
          image: ghcr.io/my-airbnb/service-booking:dev-114fe01192f26302872c3daa19020ca2a620b944
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: service-booking-config
            - secretRef:
                name: service-booking-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
