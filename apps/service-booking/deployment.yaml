apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-booking
  namespace: airbnb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-booking
  template:
    metadata:
      labels:
        app: service-booking
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: service-booking
          image: ghcr.io/my-airbnb/service-booking:dev-d04a6b428e201b68eed450f1d0b110dd0a9b66a8
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: service-booking-config
            - secretRef:
                name: service-booking-secret
            - secretRef:
                name: rabbitmq-app-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
