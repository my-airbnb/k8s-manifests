apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-seeder
  namespace: airbnb
spec:
  imagePullSecrets:
  - name: ghcr-pull-secret
  replicas: 1
  selector:
    matchLabels:
      app: data-seeder
  template:
    metadata:
      labels:
        app: data-seeder
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: data-seeder
          image: ghcr.io/my-airbnb/data-seeder:dev-13c3391240248c154c8d00c7c628b6387f465c59
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: data-seeder-config
            - secretRef:
                name: data-seeder-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 10
