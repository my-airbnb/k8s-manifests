apiVersion: batch/v1
kind: Job
metadata:
  name: seed-real-all-cities
  namespace: airbnb
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: seeder
          image: ghcr.io/my-airbnb/data-seeder:dev-cf4a349026749d136d9bf4daf6e4e96142e1d4ee
          command: ["python3", "-c"]
          args:
            - |
              import seed
              seed.ensure_fixed_users()
              total = 0
              for ds in seed.INSIDE_AIRBNB_DATASETS:
                  total += seed.seed_from_insideairbnb(ds, limit=30)
              print(f"Done: {total} listings created from {len(seed.INSIDE_AIRBNB_DATASETS)} cities.")
          envFrom:
            - configMapRef:
                name: data-seeder-config
            - secretRef:
                name: data-seeder-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
