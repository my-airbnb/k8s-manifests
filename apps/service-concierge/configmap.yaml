apiVersion: v1
kind: ConfigMap
metadata:
  name: service-concierge-config
  namespace: airbnb
data:
  SERVER_PORT: "8095"
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATA_MONGODB_URI: "mongodb://mongo_user:CHANGE_ME@mongodb:27017/concierge_db?authSource=admin"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: "CHANGE_ME"
  # The chatbot's tools call the listing/experience service in-cluster to ground answers.
  CATALOG_LISTING_BASE_URL: "http://service-listing:8082"
  GEMINI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta"
  GEMINI_MODELS: "gemini-2.5-flash,gemini-2.0-flash,gemini-2.0-flash-lite"
